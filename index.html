            <style>
      #boot { position: fixed; inset: 0; z-index: 10000; background: #080807; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      #boot span { font-family: Syne, sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: -.03em; color: #f4f3ef; }
      #boot i { display: block; width: 0; height: 1px; background: #c8a96a; animation: bootfill 1.1s cubic-bezier(.16,1,.3,1) forwards; }
      @keyframes bootfill { to { width: 120px; } }
      html, body { overflow-x: clip; }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
    </style>
    <script>
      setTimeout(function () {
        var b = document.getElementById("boot");
        if (b) {
          b.remove();
          document.documentElement.style.overflow = "";
          document.body.style.overflow = "";
        }
      }, 5000);
    </script>
